<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-label="The Python host calls the engine's exports; the engine calls the host's env imports and WASI imports; both sides read and write the engine's linear memory, and the host checks every read against its size" fill="none" stroke="currentColor"  font-size="14">
  <title>The Python host calls the engine's exports; the engine calls the host's env imports and WASI imports; both sides read and write the engine's linear memory, and the host checks every read against its size</title>
  <style>svg{color:#1f2328;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{color:#e6edf3}}</style>
  <defs>
    <marker id="abi-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" stroke="none" />
    </marker>
  </defs>
  <rect x="20" y="20" width="260" height="250" rx="8" stroke-width="2" />
  <text x="40" y="48" fill="currentColor" stroke="none" font-weight="600">Host: _Instance</text>
  <text x="40" y="74" fill="currentColor" stroke="none" opacity="0.8">quickjs_rs/_engine.py</text>
  <text x="40" y="110" fill="currentColor" stroke="none" opacity="0.8">Converts Python values</text>
  <text x="40" y="132" fill="currentColor" stroke="none" opacity="0.8">Holds handles (plain ints)</text>
  <text x="40" y="154" fill="currentColor" stroke="none" opacity="0.8">Runs host functions</text>
  <text x="40" y="176" fill="currentColor" stroke="none" opacity="0.8">Loads modules, keeps time</text>
  <rect x="580" y="20" width="260" height="250" rx="8" stroke-width="2" />
  <text x="600" y="48" fill="currentColor" stroke="none" font-weight="600">Engine: _guest.wasm</text>
  <text x="600" y="74" fill="currentColor" stroke="none" opacity="0.8">crates/quickjs-wasm</text>
  <text x="600" y="110" fill="currentColor" stroke="none" opacity="0.8">QuickJS runtime + context</text>
  <text x="600" y="132" fill="currentColor" stroke="none" opacity="0.8">Every JavaScript value</text>
  <text x="600" y="154" fill="currentColor" stroke="none" opacity="0.8">Handle boxes, result buffer</text>
  <text x="600" y="176" fill="currentColor" stroke="none" opacity="0.8">Pending promises by ID</text>
  <line x1="280" y1="80" x2="578" y2="80" stroke-width="1.5" marker-end="url(#abi-arrow)" />
  <text x="430" y="70" fill="currentColor" stroke="none" text-anchor="middle">exports (54 functions)</text>
  <text x="430" y="100" fill="currentColor" stroke="none" text-anchor="middle" opacity="0.7">i32 / i64 in, i32 out</text>
  <line x1="580" y1="150" x2="282" y2="150" stroke-width="1.5" marker-end="url(#abi-arrow)" />
  <text x="430" y="140" fill="currentColor" stroke="none" text-anchor="middle">env imports (4)</text>
  <text x="430" y="170" fill="currentColor" stroke="none" text-anchor="middle" opacity="0.7">host_call, host_interrupt, modules</text>
  <line x1="580" y1="220" x2="282" y2="220" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#abi-arrow)" />
  <text x="430" y="210" fill="currentColor" stroke="none" text-anchor="middle">WASI imports</text>
  <text x="430" y="240" fill="currentColor" stroke="none" text-anchor="middle" opacity="0.7">clock, entropy, stdio (wasmtime)</text>
  <rect x="20" y="310" width="820" height="70" rx="8" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="430" y="338" fill="currentColor" stroke="none" text-anchor="middle" font-weight="600">Linear memory: owned by the engine</text>
  <text x="430" y="362" fill="currentColor" stroke="none" text-anchor="middle" opacity="0.8">The host reads and writes it only at offsets the engine handed out, after a bounds check</text>
  <line x1="150" y1="270" x2="150" y2="308" stroke-width="1.5" marker-start="url(#abi-arrow)" marker-end="url(#abi-arrow)" />
  <line x1="710" y1="270" x2="710" y2="308" stroke-width="1.5" marker-start="url(#abi-arrow)" marker-end="url(#abi-arrow)" />
</svg>
