<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" role="img" aria-label="Shared by the process: the Engine compiles _guest.wasm into a Module, and two Linkers define its imports. Each Context owns a Store. The Module and a Linker are instantiated into it, giving an Instance with its exports and __stack_pointer global, and a linear Memory holding the QuickJS runtime and context, the JS heap, handles, pending promises and module cache. Context B has its own Store, Instance and Memory." fill="none" stroke="currentColor"  font-size="14">
  <title>Shared by the process: the Engine compiles _guest.wasm into a Module, and two Linkers define its imports. Each Context owns a Store. The Module and a Linker are instantiated into it, giving an Instance with its exports and __stack_pointer global, and a linear Memory holding the QuickJS runtime and context, the JS heap, handles, pending promises and module cache. Context B has its own Store, Instance and Memory.</title>
  <style>svg{color:#1f2328;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}@media (prefers-color-scheme:dark){svg{color:#e6edf3}}</style>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" stroke="none" />
    </marker>
  </defs>
  <rect x="20" y="10" width="820" height="54" rx="8" stroke-width="1.5" />
  <text x="40" y="34" fill="currentColor" stroke="none" font-weight="600">Python API: Runtime, Context, Handle, Snapshot</text>
  <text x="40" y="54" fill="currentColor" stroke="none" opacity="0.8">runtime.py, context.py, handle.py → the host adapter in _engine.py</text>
  <rect x="20" y="84" width="820" height="170" rx="8" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="40" y="108" fill="currentColor" stroke="none" font-weight="600">Shared by the whole process, read-only after setup</text>
  <rect x="40" y="124" width="230" height="110" rx="6" stroke-width="1.5" />
  <text x="55" y="148" fill="currentColor" stroke="none" font-weight="600">Engine</text>
  <text x="55" y="172" fill="currentColor" stroke="none" opacity="0.8">compiler settings</text>
  <text x="55" y="194" fill="currentColor" stroke="none" opacity="0.8">one per process</text>
  <rect x="315" y="124" width="230" height="110" rx="6" stroke-width="1.5" />
  <text x="330" y="148" fill="currentColor" stroke="none" font-weight="600">Module</text>
  <text x="330" y="172" fill="currentColor" stroke="none" opacity="0.8">_guest.wasm as machine code</text>
  <text x="330" y="194" fill="currentColor" stroke="none" opacity="0.8">no state</text>
  <text x="330" y="216" fill="currentColor" stroke="none" opacity="0.8">compiled once, on first use</text>
  <rect x="590" y="124" width="230" height="110" rx="6" stroke-width="1.5" />
  <text x="605" y="148" fill="currentColor" stroke="none" font-weight="600">Linker (two)</text>
  <text x="605" y="172" fill="currentColor" stroke="none" opacity="0.8">env.* host imports</text>
  <text x="605" y="194" fill="currentColor" stroke="none" opacity="0.8">WASI imports</text>
  <text x="605" y="216" fill="currentColor" stroke="none" opacity="0.8">second one: clock= override</text>
  <line x1="270" y1="179" x2="313" y2="179" stroke-width="1.5" marker-end="url(#arch-arrow)" />
  <text x="292" y="170" fill="currentColor" stroke="none" text-anchor="middle" font-size="11">compiles</text>
  <path d="M 430 234 L 430 262 L 220 262 L 220 300" stroke-width="1.5" marker-end="url(#arch-arrow)" />
  <path d="M 430 262 L 640 262 L 640 300" stroke-width="1.5" marker-end="url(#arch-arrow)" />
  <path d="M 705 234 L 705 262 L 640 262" stroke-width="1.5" />
  <text x="430" y="286" fill="currentColor" stroke="none" text-anchor="middle" font-size="12">instantiate Module + Linker into a new Store (fast)</text>
  <rect x="20" y="302" width="400" height="246" rx="8" stroke-width="2" />
  <text x="40" y="326" fill="currentColor" stroke="none" font-weight="600">Context A owns Store A</text>
  <text x="40" y="346" fill="currentColor" stroke="none" opacity="0.8" font-size="12">all mutable state, plus its WASI settings</text>
  <rect x="40" y="358" width="360" height="62" rx="6" stroke-width="1.5" />
  <text x="55" y="382" fill="currentColor" stroke="none" font-weight="600">Instance</text>
  <text x="55" y="404" fill="currentColor" stroke="none" opacity="0.8">exports, __stack_pointer global</text>
  <rect x="40" y="430" width="360" height="104" rx="6" stroke-width="1.5" />
  <text x="55" y="454" fill="currentColor" stroke="none" font-weight="600">Memory (linear)</text>
  <text x="55" y="476" fill="currentColor" stroke="none" opacity="0.8">QuickJS runtime + context, the JS heap</text>
  <text x="55" y="498" fill="currentColor" stroke="none" opacity="0.8">handles, pending promises, module cache</text>
  <text x="55" y="520" fill="currentColor" stroke="none" opacity="0.8">a snapshot is a copy of this</text>
  <rect x="440" y="302" width="400" height="246" rx="8" stroke-width="2" />
  <text x="460" y="326" fill="currentColor" stroke="none" font-weight="600">Context B owns Store B</text>
  <text x="460" y="346" fill="currentColor" stroke="none" opacity="0.8" font-size="12">nothing mutable shared with A</text>
  <rect x="460" y="358" width="360" height="62" rx="6" stroke-width="1.5" />
  <text x="475" y="382" fill="currentColor" stroke="none" font-weight="600">Instance</text>
  <text x="475" y="404" fill="currentColor" stroke="none" opacity="0.8">its own exports and globals</text>
  <rect x="460" y="430" width="360" height="104" rx="6" stroke-width="1.5" />
  <text x="475" y="454" fill="currentColor" stroke="none" font-weight="600">Memory (linear)</text>
  <text x="475" y="476" fill="currentColor" stroke="none" opacity="0.8">its own JS heap</text>
  <text x="475" y="498" fill="currentColor" stroke="none" opacity="0.8">unreachable from A</text>
</svg>
